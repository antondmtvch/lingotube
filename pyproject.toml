[project]
name = "lingotube"
version = "0.1.0"
description = "CLI for YouTube live-chat transcription, summary and translation"
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "dependency-injector",
    "typer",
    "platformdirs",
    "browser-cookie3",
]

[project.scripts]
lingotube = "lingotube.cli:main"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ["py314"]

# On a non-UTF-8 Windows console run isort with PYTHONUTF8=1: isort --check-only writes to
# os.devnull in the locale encoding and skips files with non-ASCII text ('charmap' warnings).
[tool.isort]
profile = "black"
src_paths = ["src", "tests", "probe"]
