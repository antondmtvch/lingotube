[project]
name = "lingotube"
version = "0.1.0"
description = "Subtitles, transcripts and summaries of YouTube videos through YouTube's chat: a CLI for AI agents and people"
readme = "docs/pypi/README.md"
license = "MIT"
authors = [{ name = "antondmtvch" }]
keywords = ["youtube", "transcript", "subtitles", "summary", "ai-agent", "claude-code"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "dependency-injector",
    "typer",
    "platformdirs",
    "browser-cookie3",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://skills.sh/antondmtvch/lingotube"
Repository = "https://github.com/antondmtvch/lingotube"
Issues = "https://github.com/antondmtvch/lingotube/issues"

[project.scripts]
lingotube = "lingotube.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # docs keep their code examples as written

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "D",    # pydocstyle: every public module, class, function and method has a docstring
]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
